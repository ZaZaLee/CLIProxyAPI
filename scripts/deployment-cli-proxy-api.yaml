apiVersion: v1
kind: Namespace
metadata:
  name: ai
---
apiVersion: v1
kind: Secret
metadata:
  name: harbor-registry
  namespace: ai
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"sig-harbor.vancygame.com":{"username":"admin","password":"tG8dS1mP6yA0tB9x","auth":"YWRtaW46dEc4ZFMxbVA2eUEwdEI5eA=="}}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cli-proxy-api-bootstrap-config
  namespace: ai
data:
  config.yaml: |
    host: ""
    port: 8310
    auth-dir: "~/.cli-proxy-api"
    logging-to-file: false
    logs-max-total-size-mb: 0
    api-keys: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cli-proxy-api
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cli-proxy-api
  template:
    metadata:
      labels:
        app: cli-proxy-api
    spec:
      imagePullSecrets:
        - name: harbor-registry
      initContainers:
        - name: prepare-runtime-files
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -eu
            - -c
          args:
            - |
              mkdir -p /data/auths
              if [ ! -s /data/config.yaml ]; then
                cp /bootstrap/config.yaml /data/config.yaml
              fi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: bootstrap-config
              mountPath: /bootstrap
      containers:
        - name: cli-proxy-api
          image: sig-harbor.vancygame.com/ai/cli-proxy-api:ai-sig
          imagePullPolicy: Always
          ports:
            - containerPort: 8310
              name: http
          volumeMounts:
            - name: data
              mountPath: /CLIProxyAPI/config.yaml
              subPath: config.yaml
            - name: data
              mountPath: /root/.cli-proxy-api
              subPath: auths
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          hostPath:
            path: /opt/AI/CLIProxyAPI
            type: DirectoryOrCreate
        - name: bootstrap-config
          configMap:
            name: cli-proxy-api-bootstrap-config
---
apiVersion: v1
kind: Service
metadata:
  name: cli-proxy-api
  namespace: ai
spec:
  selector:
    app: cli-proxy-api
  ports:
    - name: http
      port: 8310
      targetPort: http
